<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Отмечайте удобные дни для походов в офис и смотрите планы команды.">
    <title>gooffice — планы команды</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
    <script src="./data.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div class="member-picker" id="member-picker" role="group" aria-label="Кто отмечается">
          <span class="member-label">Отмечается:</span>
          <div class="member-options" id="member-options"></div>
        </div>
        <span class="brand">gooffice</span>
      </div>
    </header>
    <main class="page">
      <div class="intro">
        <p>Это страничка, чтобы планировать походы в офис. Выбирайте себя один раз — <em>браузер запомнит</em>, если не чистить историю. Можно отмечаться за других.</p>
        <p>Тыкайте в дни, в которые удобно пойти. Дальше делайте с этим что хотите.</p>
      </div>
      <div class="calendar" id="calendar" aria-label="Календарь походов в офис"></div>
      <p class="storage-note sr-only" id="storage-note">Отметки общие только для вкладок этого браузера.</p>
      <noscript>Для календаря нужен JavaScript. Включите его в настройках браузера.</noscript>
    </main>
    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
  </body>
</html>
